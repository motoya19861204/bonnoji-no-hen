<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>煩悩児の変</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  canvas { display: block; image-rendering: pixelated; }
  #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: none; z-index: 5; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
    color: #fff; font-family: sans-serif; z-index: 10; background: rgba(0,0,0,0.85); cursor: pointer; }
  #overlay h1 { font-size: 44px; margin: 0 0 12px; letter-spacing: 4px; }
  #overlay p { font-size: 16px; opacity: .8; margin: 4px; }
  #touch { position: fixed; inset: 0; z-index: 6; display: none; pointer-events: none; }
  .pad { position: absolute; bottom: 4vh; width: 34vmin; height: 34vmin; left: 3vw; pointer-events: auto; }
  .pad div { position: absolute; width: 33%; height: 33%; background: rgba(255,255,255,.18); border-radius: 12%; }
  .btn { position: absolute; bottom: 6vh; width: 16vmin; height: 16vmin; border-radius: 50%; background: rgba(255,80,80,.35);
    pointer-events: auto; color: #fff; font: bold 5vmin sans-serif; display: flex; align-items: center; justify-content: center; }
  #rotate { position: fixed; inset: 0; z-index: 20; background: #000; color: #fff; display: none; align-items: center; justify-content: center;
    flex-direction: column; font-family: sans-serif; font-size: 22px; text-align: center; }
  #rotate .icon { font-size: 80px; animation: rot 1.6s ease-in-out infinite; }
  @keyframes rot { 0%,20% { transform: rotate(0deg);} 60%,100% { transform: rotate(90deg);} }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="wrap"></div>
<video id="video" playsinline preload="auto"></video>
<div id="touch">
  <div class="pad">
    <div data-k="ArrowUp" style="left:33%;top:0"></div>
    <div data-k="ArrowLeft" style="left:0;top:33%"></div>
    <div data-k="ArrowRight" style="left:66%;top:33%"></div>
    <div data-k="ArrowDown" style="left:33%;top:66%"></div>
  </div>
  <div class="btn" data-k="KeyZ" style="right:22vmin">攻</div>
  <div class="btn" data-k="KeyX" style="right:3vw">跳</div>
</div>
<div id="rotate"><div class="icon">📱</div><div>スマホを横向きにしてください</div></div>
<div id="overlay">
  <h1>煩悩児の変</h1>
  <p>クリック / タップ / 何かキーで開始</p>
  <p>移動: 矢印キー or WASD　攻撃: Z (3連打)　ジャンプ: X</p>
</div>
<script src="lib/pixi.min.js"></script>
<script src="main.js"></script>
</body>
</html>
